          - label: "Contato e formulário"
            name: contactSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Rótulo do nome", name: name, widget: string }
              - { label: "Exemplo no campo nome", name: namePh, widget: string }
              - { label: "Rótulo do contato", name: contact, widget: string }
              - { label: "Exemplo no campo contato", name: contactPh, widget: string }
              - { label: "Rótulo do projeto", name: project, widget: string }
              - { label: "Exemplo no campo projeto", name: projectPh, widget: string }
              - { label: "Nota ao lado do botão", name: note, widget: string }
              - { label: "Botão enviar", name: send, widget: string }
              - { label: "Mensagem: enviando", name: sending, widget: string }
