backend:
  name: github
  repo: vitorsarkis96/melo-site
  branch: main
  base_url: https://www.melocreative.com.br
  auth_endpoint: api/auth

local_backend: true

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: site
    label: "Configurações do site"
    files:
      - name: settings
        label: "Contatos e links"
        file: "src/_data/site.json"
        fields:
          - { label: "URL do formulário de orçamento", name: quoteForm, widget: string, hint: "Link externo aberto pelos botões 'Solicitar orçamento'." }
          - { label: "WhatsApp", name: whatsapp, widget: string }
          - { label: "Instagram", name: instagram, widget: string }
          - { label: "LinkedIn", name: linkedin, widget: string }
          - { label: "E-mail", name: email, widget: string }
          - { label: "Telefone", name: phone, widget: string }
          - { label: "Endereço", name: addressLine, widget: string }
          - { label: "Link da apresentação", name: deckUrl, widget: string }
          - { label: "ID do formulário de contato (Formspree)", name: formspreeId, widget: string, hint: "Só o código depois de formspree.io/f/ — ex: xyzabcde. Sem isso o formulário de contato não envia e-mail." }
          - label: "Pop-up de newsletter"
            name: newsletterPopup
            widget: object
            collapsed: true
            fields:
              - { label: "Ativado", name: enabled, widget: boolean, default: true }
              - { label: "Aparece depois de quantos segundos", name: delaySeconds, widget: number, value_type: int, min: 1, max: 60, default: 6 }
              - label: "Inglês"
                name: en
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Placeholder do campo de e-mail", name: placeholder, widget: string }
                  - { label: "Texto do botão", name: submitLabel, widget: string }
                  - { label: "Mensagem de sucesso", name: successMessage, widget: string }
                  - { label: "Mensagem de erro", name: errorMessage, widget: string }
                  - { label: "Texto alternativo do botão fechar", name: dismissAria, widget: string }
              - label: "Português"
                name: pt
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Placeholder do campo de e-mail", name: placeholder, widget: string }
                  - { label: "Texto do botão", name: submitLabel, widget: string }
                  - { label: "Mensagem de sucesso", name: successMessage, widget: string }
                  - { label: "Mensagem de erro", name: errorMessage, widget: string }
                  - { label: "Texto alternativo do botão fechar", name: dismissAria, widget: string }

  - name: conteudo
    label: "Textos do site"
    editor: { preview: false }
    files:
      - label: "Geral (vídeo, cases em destaque, redes)"
        name: geral
        file: "src/_data/conteudo/geral.json"
        fields:
          - { label: "ID do showreel no YouTube", name: reel, widget: string, hint: "Só o código depois de watch?v= . Ex: 5Geme6sM6HU" }
          - { label: "Cases no banner (slugs, em ordem)", name: heroCases, widget: list, hint: "Slug do case, ex: mev, skintec" }
          - { label: "Cases na home (slugs, em ordem)", name: homeCases, widget: list, hint: "Slug do case, ex: mev, syn" }
          - label: "Logos de clientes"
            name: clients
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            hint: "O arquivo fica em /assets/img/clients/NOME.png"
            fields:
              - { label: "Arquivo (sem .png)", name: file, widget: string }
              - { label: "Nome do cliente", name: name, widget: string }
          - label: "Redes e links"
            name: social
            widget: object
            collapsed: true
            fields:
              - { label: "WhatsApp", name: whatsapp, widget: string }
              - { label: "Linktree", name: linktree, widget: string }
              - { label: "Facebook", name: facebook, widget: string }
              - { label: "Upwork", name: upwork, widget: string }
              - { label: "Google Maps (avaliações)", name: maps, widget: string }
          - label: "Imagem de cada serviço"
            name: serviceImages
            widget: object
            collapsed: true
            fields:
              - label: "Estratégia"
                name: estrategia
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
              - label: "Marca"
                name: marca
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
              - label: "Cultura"
                name: cultura
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
              - label: "Institucional"
                name: institucional
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
              - label: "Digital"
                name: digital
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
              - label: "Audiovisual"
                name: audiovisual
                widget: object
                collapsed: true
                fields:
                  - { label: "Imagem", name: img, widget: image }
                  - { label: "Enquadramento (opcional)", name: pos, widget: string, required: false, hint: "Ex: center, right top" }
                  - { label: "Slug do case relacionado", name: slug, widget: string }
                  - { label: "Nome do case", name: name, widget: string }
      - label: "Português"
        name: pt
        file: "src/_data/conteudo/pt.json"
        fields:
          - { label: "Título da aba do navegador (SEO)", name: metaTitle, widget: string }
          - { label: "Descrição para o Google (SEO)", name: metaDescription, widget: text }
          - label: "Menu"
            name: nav
            widget: object
            collapsed: true
            fields:
              - { label: "Serviços", name: services, widget: string }
              - { label: "Cases", name: cases, widget: string }
              - { label: "FAQ", name: faq, widget: string }
              - { label: "Botão de contato", name: cta, widget: string }
              - { label: "Showreel", name: reel, widget: string }
          - label: "Banner (hero)"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Título, linha 1", name: l1, widget: string }
              - { label: "Título, linha 2", name: l2, widget: string }
              - { label: "Botão de cases", name: cases, widget: string }
          - label: "Dados no banner"
            name: meta
            widget: list
            collapsed: true
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Rótulo", name: label, widget: string }
              - { label: "Valor", name: value, widget: string }
          - label: "Showreel"
            name: reelSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Botão", name: cta, widget: string }
              - { label: "Legenda do vídeo", name: label, widget: string }
              - { label: "Texto 'Assistir'", name: watch, widget: string }
          - label: "Serviços: cabeçalho"
            name: servicesSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Texto 'Case relacionado'", name: related, widget: string }
              - { label: "Botão", name: talk, widget: string }
          - label: "Serviços (abas)"
            name: services
            widget: list
            collapsed: true
            summary: "{{fields.t}}"
            fields:
              - { label: "Código interno (não altere)", name: key, widget: string, hint: "Liga o serviço à imagem e ao filtro. Ex: estrategia" }
              - { label: "Nome da aba", name: tab, widget: string }
              - { label: "Título", name: t, widget: string }
              - { label: "Subtítulo", name: s, widget: string }
              - { label: "Descrição", name: d, widget: text }
              - { label: "Entregas", name: l, widget: list, field: { label: "Entrega", name: item, widget: string } }
          - label: "Cases na home: cabeçalho"
            name: casesSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Botão 'Todos os cases'", name: all, widget: string }
          - label: "Seção de números e avaliações"
            name: numbersSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
          - label: "Avaliações (aparecem também na versão em inglês)"
            name: reviews
            widget: list
            collapsed: true
            summary: "{{fields.name}} · {{fields.company}}"
            fields:
              - { label: "Nome", name: name, widget: string }
              - { label: "Empresa", name: company, widget: string }
              - { label: "Depoimento", name: text, widget: text }
          - label: "FAQ: cabeçalho"
            name: faqSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto antes do e-mail", name: lead, widget: string }
          - label: "FAQ: perguntas"
            name: faq
            widget: list
            collapsed: true
            summary: "{{fields.q}}"
            fields:
              - { label: "Pergunta", name: q, widget: string }
              - { label: "Resposta", name: a, widget: text }
          - label: "Contato e formulário"
            name: contactSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Rótulo do nome", name: name, widget: string }
              - { label: "Exemplo no campo nome", name: namePh, widget: string }
              - { label: "Rótulo do contato", name: contact, widget: string }
              - { label: "Exemplo no campo contato", name: contactPh, widget: string }
              - { label: "Rótulo do projeto", name: project, widget: string }
              - { label: "Exemplo no campo projeto", name: projectPh, widget: string }
              - { label: "Nota ao lado do botão", name: note, widget: string }
              - { label: "Botão enviar", name: send, widget: string }
              - { label: "Mensagem: enviando", name: sending, widget: string }
              - { label: "Mensagem: enviado", name: ok, widget: string }
              - { label: "Mensagem: erro", name: err, widget: string }
              - { label: "Erro: falta nome", name: errName, widget: string }
              - { label: "Erro: contato inválido", name: errContact, widget: string }
              - label: "Informações de contato"
                name: info
                widget: list
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Rótulo", name: label, widget: string }
                  - { label: "Texto", name: value, widget: string }
                  - { label: "Link (opcional)", name: link, widget: string, required: false }
          - label: "Página de cases"
            name: casesPage
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Texto quando o filtro não tem cases", name: empty, widget: string }
              - { label: "Título do bloco final", name: ctaTitle, widget: string }
              - label: "Filtros"
                name: filters
                widget: list
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Código (não altere)", name: key, widget: string }
                  - { label: "Nome", name: label, widget: string }
          - label: "Página de case (rótulos)"
            name: casePage
            widget: object
            collapsed: true
            fields:
              - { label: "O desafio", name: challenge, widget: string }
              - { label: "A abordagem", name: approach, widget: string }
              - { label: "Cliente", name: client, widget: string }
              - { label: "Projeto", name: project, widget: string }
              - { label: "Frentes", name: fronts, widget: string }
              - { label: "Ano", name: year, widget: string }
              - { label: "Próximo case", name: next, widget: string }
              - { label: "Título do bloco final", name: ctaTitle, widget: string }
              - { label: "Todos os cases", name: allCases, widget: string }
          - label: "Página de contato"
            name: contactPage
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
          - label: "Rodapé"
            name: footer
            widget: object
            collapsed: true
            fields:
              - { label: "Texto sobre a Melo", name: about, widget: text }
      - label: "Inglês"
        name: en
        file: "src/_data/conteudo/en.json"
        fields:
          - { label: "Título da aba do navegador (SEO)", name: metaTitle, widget: string }
          - { label: "Descrição para o Google (SEO)", name: metaDescription, widget: text }
