backend:
  name: github
  repo: vitorsarkis96/melo-site
  branch: main
  base_url: https://www.melocreative.com.br
  auth_endpoint: api/auth

local_backend: true

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: site
    label: "Configurações do site"
    files:
      - name: settings
        label: "Contatos e links"
        file: "src/_data/site.json"
        fields:
          - { label: "URL do formulário de orçamento", name: quoteForm, widget: string, hint: "Link externo aberto pelos botões 'Solicitar orçamento'." }
          - { label: "WhatsApp", name: whatsapp, widget: string }
          - { label: "Instagram", name: instagram, widget: string }
          - { label: "LinkedIn", name: linkedin, widget: string }
          - { label: "E-mail", name: email, widget: string }
          - { label: "Telefone", name: phone, widget: string }
          - { label: "Endereço", name: addressLine, widget: string }
          - { label: "Link da apresentação", name: deckUrl, widget: string }
          - { label: "ID do formulário de contato (Formspree)", name: formspreeId, widget: string, hint: "Só o código depois de formspree.io/f/ — ex: xyzabcde. Sem isso o formulário de contato não envia e-mail." }
          - label: "Pop-up de newsletter"
            name: newsletterPopup
            widget: object
            collapsed: true
            fields:
              - { label: "Ativado", name: enabled, widget: boolean, default: true }
              - { label: "Aparece depois de quantos segundos", name: delaySeconds, widget: number, value_type: int, min: 1, max: 60, default: 6 }
              - label: "Inglês"
                name: en
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Placeholder do campo de e-mail", name: placeholder, widget: string }
                  - { label: "Texto do botão", name: submitLabel, widget: string }
                  - { label: "Mensagem de sucesso", name: successMessage, widget: string }
                  - { label: "Mensagem de erro", name: errorMessage, widget: string }
                  - { label: "Texto alternativo do botão fechar", name: dismissAria, widget: string }
              - label: "Português"
                name: pt
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Placeholder do campo de e-mail", name: placeholder, widget: string }
                  - { label: "Texto do botão", name: submitLabel, widget: string }
                  - { label: "Mensagem de sucesso", name: successMessage, widget: string }
                  - { label: "Mensagem de erro", name: errorMessage, widget: string }
                  - { label: "Texto alternativo do botão fechar", name: dismissAria, widget: string }

  - name: home
    label: "Home"
    files:
      - name: home
        label: "Home"
        file: "src/_data/pages/home.json"
        fields:
          - { label: "Imagem de fundo do hero (reserva, usada só se a lista \"Carrossel do banner principal\" abaixo estiver vazia)", name: heroImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
          - label: "Carrossel do banner principal (topo da Home)"
            name: heroCarousel
            widget: object
            hint: "Tudo relacionado ao banner grande do topo da Home fica aqui: quais cases aparecem, em que ordem e o tempo entre eles."
            fields:
              - { label: "Tempo entre slides (segundos)", name: autoplaySeconds, widget: number, value_type: int, min: 2, max: 30, default: 6 }
              - label: "Cases no carrossel"
                name: slides
                widget: list
                collapsed: false
                summary: "{{fields.case}}"
                hint: "Adicione os cases que devem aparecer no banner, na ordem desejada. Arraste os itens pelo ícone à esquerda pra reordenar."
                fields:
                  - { label: "Case", name: case, widget: relation, collection: cases, search_fields: [slug], value_field: "slug", display_fields: [slug], hint: "Escolha um case já cadastrado na aba Cases." }
                  - label: "Zoom da imagem"
                    name: zoom
                    widget: select
                    default: 100
                    options:
                      - { label: "Padrão (sem zoom)", value: 100 }
                      - { label: "Aproximar um pouco", value: 125 }
                      - { label: "Aproximar bastante", value: 150 }
                    hint: "Use quando a foto do case tiver muito espaço vazio ao redor do assunto principal."
                  - label: "Parte da imagem em destaque"
                    name: focus
                    widget: select
                    default: center
                    options:
                      - { label: "Centro (padrão)", value: center }
                      - { label: "Topo", value: top }
                      - { label: "Base", value: bottom }
                    hint: "Qual parte da imagem fica visível ao aplicar o zoom acima. Só tem efeito no desktop — no celular o banner já é bem mais estreito e a foto se ajusta sozinha."
          - { label: "Imagem da seção de fotografia", name: photoHeroImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
          - { label: "URL embed do showreel", name: showreelUrl, widget: string, hint: "Cole a URL embed do YouTube, não a URL curta youtu.be." }
          - label: "Logos de clientes"
            name: clientLogos
            widget: list
            collapsed: false
            summary: "{{altEn}}"
            fields:
              - { label: "Classe CSS (avançado, não altere)", name: class, widget: string }
              - { label: "Imagem do logo", name: src, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
              - { label: "Texto alternativo (Inglês)", name: altEn, widget: string }
              - { label: "Texto alternativo (Português)", name: altPt, widget: string }
          - label: "Conteúdo em Inglês"
            name: en
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Imagem de compartilhamento (redes sociais)", name: ogImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
              - { label: "Descrição para dados estruturados (SEO, avançado)", name: structuredDataDescription, widget: text }
              - { label: "Texto alternativo da imagem do hero", name: heroAlt, widget: string }
              - { label: "Título principal (headline)", name: heroHeadline, widget: text }
              - { label: "Rótulo \"Empresas que confiam na Melo\" (topo)", name: clientsTopLabel, widget: string }
              - { label: "Tag \"Como atuamos\"", name: atuamosTag, widget: string }
              - { label: "Texto de introdução", name: introStatement, widget: text }
              - { label: "Texto alternativo da foto", name: photoHeroAlt, widget: string }
              - { label: "Título da seção de fotografia", name: photoHeroTitle, widget: string }
              - { label: "Descrição da seção de fotografia", name: photoHeroDesc, widget: string }
              - { label: "Tag do showreel", name: showreelTag, widget: string }
              - { label: "Título do showreel", name: showreelTitle, widget: string }
              - { label: "Descrição do showreel", name: showreelDesc, widget: text }
              - { label: "Tag \"O que fazemos\"", name: whatWeDoTag, widget: string }
              - label: "Serviços"
                name: services
                widget: list
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
              - { label: "Tag \"Nossos números\"", name: numbersTag, widget: string }
              - { label: "Valor do número grande", name: bigNumberValue, widget: string, hint: "ex: 3000" }
              - { label: "Formato do número grande", name: bigNumberFormat, widget: select, options: ["", thousand], required: false, hint: "'thousand' mostra 3.000 em vez de 3000" }
              - { label: "Rótulo do número grande", name: bigNumberLabel, widget: string }
              - { label: "Descrição dos números", name: numbersDesc, widget: text }
              - label: "Estatísticas pequenas (3)"
                name: stats
                widget: list
                fields:
                  - { label: "Valor", name: value, widget: string }
                  - { label: "Sufixo (ex: ' years' ou '%')", name: suffix, widget: string, required: false }
                  - { label: "Classe do sufixo (avançado — use 'pct' só para %)", name: suffixClass, widget: string, required: false }
                  - { label: "Mostrar prefixo '+'", name: showPlus, widget: boolean, default: true, required: false }
                  - { label: "Rótulo", name: label, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Destacar em laranja", name: orange, widget: boolean, default: false, required: false }
              - { label: "Título da seção de portfólio", name: portfolioIntroTitle, widget: string }
              - { label: "Título \"Conheça a Melo\"", name: aboutMeloHeading, widget: string }
              - { label: "Texto do botão \"Mais sobre nós\"", name: aboutMeloMoreLabel, widget: string }
              - { label: "Texto do botão \"Nossa apresentação\"", name: aboutMeloDeckLabel, widget: string }
              - { label: "Sobre a Melo — parágrafo 1", name: aboutMeloText1, widget: text }
              - { label: "Sobre a Melo — parágrafo 2", name: aboutMeloText2, widget: text }
              - { label: "Título da seção de entregas", name: deliverHeading, widget: string }
              - label: "Etapas de entrega (6)"
                name: deliverSteps
                widget: list
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
              - { label: "Tag da seção de FAQ", name: faqTag, widget: string }
              - { label: "Título da seção de FAQ", name: faqHeading, widget: string }
              - label: "Perguntas frequentes"
                name: faq
                widget: list
                summary: "{{q}}"
                fields:
                  - { label: "Pergunta", name: q, widget: string }
                  - { label: "Resposta", name: a, widget: text }
              - { label: "Rótulo \"Empresas que confiam na Melo\" (rodapé)", name: clientsBottomLabel, widget: string }
          - label: "Conteúdo em Português"
            name: pt
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Imagem de compartilhamento (redes sociais)", name: ogImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
              - { label: "Descrição para dados estruturados (SEO, avançado)", name: structuredDataDescription, widget: text }
              - { label: "Texto alternativo da imagem do hero", name: heroAlt, widget: string }
              - { label: "Título principal (headline)", name: heroHeadline, widget: text }
              - { label: "Rótulo \"Empresas que confiaram na Melo\" (topo)", name: clientsTopLabel, widget: string }
              - { label: "Tag \"Como atuamos\"", name: atuamosTag, widget: string }
              - { label: "Texto de introdução", name: introStatement, widget: text }
              - { label: "Texto alternativo da foto", name: photoHeroAlt, widget: string }
              - { label: "Título da seção de fotografia", name: photoHeroTitle, widget: string }
              - { label: "Descrição da seção de fotografia", name: photoHeroDesc, widget: string }
              - { label: "Tag do showreel", name: showreelTag, widget: string }
              - { label: "Título do showreel", name: showreelTitle, widget: string }
              - { label: "Descrição do showreel", name: showreelDesc, widget: text }
              - { label: "Tag \"Onde atuamos\"", name: whatWeDoTag, widget: string }
              - label: "Serviços"
                name: services
                widget: list
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
              - { label: "Tag \"Nossos números\"", name: numbersTag, widget: string }
              - { label: "Valor do número grande", name: bigNumberValue, widget: string }
              - { label: "Formato do número grande", name: bigNumberFormat, widget: select, options: ["", thousand], required: false }
              - { label: "Rótulo do número grande", name: bigNumberLabel, widget: string }
              - { label: "Descrição dos números", name: numbersDesc, widget: text }
              - label: "Estatísticas pequenas (3)"
                name: stats
                widget: list
                fields:
                  - { label: "Valor", name: value, widget: string }
                  - { label: "Sufixo", name: suffix, widget: string, required: false }
                  - { label: "Classe do sufixo (avançado)", name: suffixClass, widget: string, required: false }
                  - { label: "Mostrar prefixo '+'", name: showPlus, widget: boolean, default: true, required: false }
                  - { label: "Rótulo", name: label, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Destacar em laranja", name: orange, widget: boolean, default: false, required: false }
              - { label: "Título da seção de portfólio", name: portfolioIntroTitle, widget: string }
              - { label: "Título \"Conheça a Melo\"", name: aboutMeloHeading, widget: string }
              - { label: "Texto do botão \"Mais sobre nós\"", name: aboutMeloMoreLabel, widget: string }
              - { label: "Texto do botão \"Nossa apresentação\"", name: aboutMeloDeckLabel, widget: string }
              - { label: "Sobre a Melo — parágrafo 1", name: aboutMeloText1, widget: text }
              - { label: "Sobre a Melo — parágrafo 2", name: aboutMeloText2, widget: text }
              - { label: "Título da seção de entregas", name: deliverHeading, widget: string }
              - label: "Etapas de entrega (6)"
                name: deliverSteps
                widget: list
                fields:
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
              - { label: "Tag da seção de FAQ", name: faqTag, widget: string }
              - { label: "Título da seção de FAQ", name: faqHeading, widget: string }
              - label: "Perguntas frequentes"
                name: faq
                widget: list
                summary: "{{q}}"
                fields:
                  - { label: "Pergunta", name: q, widget: string }
                  - { label: "Resposta", name: a, widget: text }
              - { label: "Rótulo \"Empresas que confiaram na Melo\" (rodapé)", name: clientsBottomLabel, widget: string }

  - name: cases_page
    label: "Página de Cases"
    files:
      - name: cases_page
        label: "Cases (página de listagem)"
        file: "src/_data/pages/cases.json"
        fields:
          - { label: "Imagem de compartilhamento (redes sociais)", name: ogImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
          - label: "Conteúdo em Inglês"
            name: en
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Título da página", name: heroTitle, widget: string }
              - { label: "Filtro: Todos", name: filterAll, widget: string }
              - { label: "Filtro: Estratégia", name: filterEstrategia, widget: string }
              - { label: "Filtro: Marca", name: filterMarca, widget: string }
              - { label: "Filtro: Sites & Sistemas", name: filterSites, widget: string }
              - { label: "Filtro: Audiovisual", name: filterAudiovisual, widget: string }
              - { label: "Mensagem de lista vazia", name: emptyState, widget: text }
          - label: "Conteúdo em Português"
            name: pt
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Título da página", name: heroTitle, widget: string }
              - { label: "Filtro: Todos", name: filterAll, widget: string }
              - { label: "Filtro: Estratégia", name: filterEstrategia, widget: string }
              - { label: "Filtro: Marca", name: filterMarca, widget: string }
              - { label: "Filtro: Sites & Sistemas", name: filterSites, widget: string }
              - { label: "Filtro: Audiovisual", name: filterAudiovisual, widget: string }
              - { label: "Mensagem de lista vazia", name: emptyState, widget: text }

  - name: contact_page
    label: "Página de Contato"
    files:
      - name: contact_page
        label: "Contato"
        file: "src/_data/pages/contact.json"
        fields:
          - { label: "Imagem de compartilhamento (redes sociais)", name: ogImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
          - label: "Conteúdo em Inglês"
            name: en
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Título da página", name: heroTitle, widget: string }
              - { label: "Descrição da página", name: heroDesc, widget: text }
              - { label: "Rótulo do campo Nome", name: labelName, widget: string }
              - { label: "Rótulo do campo E-mail", name: labelEmail, widget: string }
              - { label: "Rótulo do campo Telefone", name: labelPhone, widget: string }
              - { label: "Rótulo do campo Mensagem", name: labelMessage, widget: string }
              - { label: "Texto do botão de envio", name: submitLabel, widget: string }
              - { label: "Título de sucesso (não usado visualmente, reservado)", name: successTitle, widget: string, required: false }
              - { label: "Mensagem de sucesso", name: successMessage, widget: text }
              - { label: "Mensagem de erro", name: errorMessage, widget: text }
              - { label: "Título do bloco de WhatsApp", name: whatsappTitle, widget: string }
              - { label: "Descrição do bloco de WhatsApp", name: whatsappDesc, widget: text }
              - { label: "Texto do botão do WhatsApp", name: whatsappCta, widget: string }
          - label: "Conteúdo em Português"
            name: pt
            widget: object
            collapsed: true
            fields:
              - { label: "Título SEO", name: metaTitle, widget: string }
              - { label: "Descrição SEO", name: metaDescription, widget: text }
              - { label: "Título da página", name: heroTitle, widget: string }
              - { label: "Descrição da página", name: heroDesc, widget: text }
              - { label: "Rótulo do campo Nome", name: labelName, widget: string }
              - { label: "Rótulo do campo E-mail", name: labelEmail, widget: string }
              - { label: "Rótulo do campo Telefone", name: labelPhone, widget: string }
              - { label: "Rótulo do campo Mensagem", name: labelMessage, widget: string }
              - { label: "Texto do botão de envio", name: submitLabel, widget: string }
              - { label: "Título de sucesso (não usado visualmente, reservado)", name: successTitle, widget: string, required: false }
              - { label: "Mensagem de sucesso", name: successMessage, widget: text }
              - { label: "Mensagem de erro", name: errorMessage, widget: text }
              - { label: "Título do bloco de WhatsApp", name: whatsappTitle, widget: string }
              - { label: "Descrição do bloco de WhatsApp", name: whatsappDesc, widget: text }
              - { label: "Texto do botão do WhatsApp", name: whatsappCta, widget: string }

  - name: cases
    label: "Cases"
    label_singular: "Case"
    folder: "src/_data/cases"
    create: true
    delete: false
    slug: "{{fields.slug}}"
    extension: json
    format: json
    identifier_field: slug
    summary: "{{order}} — {{slug}}"
    fields:
      - { label: "URL slug", name: slug, widget: string, hint: "Sem espaços/acentos, minúsculo. Define a URL da página — ex: 'redcap' → melocreative.com.br/redcap. NÃO altere num case já publicado sem avisar o dev, os links quebram." }
      - { label: "Posição na grade", name: order, widget: number, value_type: int, hint: "Controla a ordem deste case na página /cases e, se marcado abaixo, na grade de cases da Home (menor = aparece antes). Não afeta o carrossel do banner — isso é configurado na página Home." }
      - { label: "Mostrar na grade da Home?", name: showOnHome, widget: boolean, default: true, hint: "Todo case criado aqui já aparece automaticamente em /cases. Este botão controla só a grade de cases da Home — o carrossel do banner principal é escolhido separadamente na página Home." }
      - { label: "Ano", name: year, widget: string }
      - label: "Categoria p/ filtro em /cases (avançado — NÃO é a mesma coisa que as Tags lá embaixo, e não aparece na página do case)"
        name: dataService
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Estratégia", value: estrategia }
          - { label: "Marca", value: marca }
          - { label: "Sites & Sistemas", value: sites-sistemas }
          - { label: "Audiovisual", value: audiovisual }
        hint: "Escolha uma ou mais categorias na lista — controla o filtro da página /cases."
      - { label: "Imagem do card (grade de cases)", name: cardImage, widget: image, media_folder: "/assets/img", public_folder: "/assets/img" }
      - label: "Cases relacionados (mostrados no rodapé da página)"
        name: otherCases
        widget: list
        hint: "Slugs de 2 outros cases, ex: aromatici, khs"
      - label: "Mídia principal (topo da página)"
        name: heroMedia
        widget: object
        fields: &mediaItemFields
          - { label: "Tipo", name: type, widget: select, options: [image, video], default: image }
          - { label: "Arquivo (foto ou vídeo)", name: src, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
          - { label: "Cor de fundo (opcional, hex)", name: bg, widget: string, required: false }
          - { label: "Ajuste da imagem", name: fit, widget: select, options: [cover, contain], required: false }
          - label: "Filtro preto e branco (opcional)"
            name: filter
            widget: select
            required: false
            options:
              - { label: "Nenhum (cor normal)", value: "" }
              - { label: "P&B clássico", value: "bw-classic" }
              - { label: "P&B alto contraste", value: "bw-contrast" }
              - { label: "P&B suave/claro", value: "bw-soft" }
          - { label: "Imagem de capa (só p/ vídeo, opcional)", name: poster, widget: file, required: false, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
          - { label: "Logo sobreposto (opcional, ex: logo do HubSpot no canto)", name: logo, widget: file, required: false, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
      - label: "Fotos e vídeos — antes de 'Nossa abordagem'"
        name: rowsBeforeApproach
        widget: list
        collapsed: false
        summary: "{{layout}}"
        fields:
          - { label: "Layout", name: layout, widget: select, options: [single, double, triple, carousel], hint: "single = 1 imagem/vídeo em largura total, double = 2 lado a lado, triple = 3 lado a lado, carousel = carrossel com abas e cards \"Painel destaque\" (peek nas bordas)" }
          - label: "Fotos/vídeos desta linha"
            name: items
            widget: list
            collapsed: false
            summary: "{{type}}"
            types: &mediaRowItemTypes
              - label: "Imagem"
                name: image
                widget: object
                fields:
                  - { label: "Arquivo", name: src, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
                  - { label: "Texto alternativo", name: alt, widget: string, required: false }
                  - { label: "Cor de fundo (opcional, hex)", name: bg, widget: string, required: false }
                  - { label: "Ajuste da imagem", name: fit, widget: select, options: [cover, contain], required: false }
                  - { label: "Posição do recorte (opcional)", name: position, widget: select, options: [top, center, bottom], required: false }
                  - { label: "Exibir como card flutuante (fundo cinza + sombra, ex: mockup de site)", name: floating, widget: boolean, required: false, default: false }
                  - label: "Filtro preto e branco (opcional)"
                    name: filter
                    widget: select
                    required: false
                    options:
                      - { label: "Nenhum (cor normal)", value: "" }
                      - { label: "P&B clássico", value: "bw-classic" }
                      - { label: "P&B alto contraste", value: "bw-contrast" }
                      - { label: "P&B suave/claro", value: "bw-soft" }
              - label: "Vídeo"
                name: video
                widget: object
                fields:
                  - { label: "Arquivo", name: src, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
                  - { label: "Imagem de capa (opcional)", name: poster, widget: file, required: false, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
              - label: "Cards de produto (com foto) — ex: Skintec"
                name: spec-cards
                widget: object
                fields:
                  - { label: "Layout", name: variant, widget: select, options: [side, top], default: side, required: false, hint: "side = foto ao lado do texto (cards largos, um só por linha). top = foto em cima do texto (cards estreitos, lado a lado com outra mídia)." }
                  - label: "Produtos"
                    name: products
                    widget: list
                    summary: "{{title}}"
                    fields:
                      - { label: "Selo", name: badge, widget: string }
                      - { label: "Título", name: title, widget: string }
                      - { label: "Subtítulo", name: subtitle, widget: string }
                      - { label: "Descrição", name: desc, widget: text }
                      - { label: "Foto", name: image, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
              - label: "Painel destaque / spotlight (fundo escuro, texto + logo) — ex: Skintec"
                name: spotlight
                widget: object
                fields:
                  - { label: "Rótulo da aba (só usado dentro de um carrossel)", name: label, widget: string, required: false }
                  - { label: "É o card ativo por padrão? (só em carrossel)", name: default, widget: boolean, required: false, default: false }
                  - { label: "Imagem de fundo", name: bg, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
                  - { label: "Logo (opcional)", name: logo, widget: file, required: false, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
                  - { label: "Proporção do logo (largura/altura, opcional — use se o logo ficar esticado/achatado)", name: logoRatio, widget: string, required: false, hint: "Ex: 1.3 para um logo quase quadrado. Deixe em branco pra usar a proporção natural do arquivo." }
                  - { label: "Título (pode usar <em>palavra</em> pra destacar em dourado)", name: heading, widget: string }
                  - { label: "Descrição", name: desc, widget: text }
                  - { label: "Selo de texto (opcional, ex: aprovações/certificações)", name: badgeText, widget: string, required: false }
                  - label: "Selos/prêmios — logos pequenos (opcional)"
                    name: awards
                    widget: list
                    required: false
                    field: { label: "Logo", name: award, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
              - label: "Paleta de cores — blocos empilhados (sem foto) — ex: MEV"
                name: swatches
                widget: object
                fields:
                  - label: "Blocos de cor (de cima pra baixo)"
                    name: bars
                    widget: list
                    summary: "{{color}}"
                    fields:
                      - { label: "Cor (hex) — deixe em branco se este bloco for dividido em duas cores", name: color, widget: string, required: false }
                      - label: "Dividir este bloco em 2 cores lado a lado (opcional)"
                        name: colors
                        widget: list
                        required: false
                        field: { label: "Cor (hex)", name: c, widget: string }
                      - { label: "Peso (altura relativa deste bloco em relação aos outros)", name: weight, widget: number }
              - label: "Fundo com padrão + logo centralizado — ex: MEV"
                name: pattern
                widget: object
                fields:
                  - { label: "Cor de fundo (hex)", name: bg, widget: string }
                  - { label: "Logo", name: logo, widget: file, media_folder: "/assets/img/cases", public_folder: "/assets/img/cases" }
      - label: "Fotos e vídeos — depois de 'Nossa abordagem'"
        name: rowsAfterApproach
        widget: list
        required: false
        collapsed: false
        summary: "{{layout}}"
        fields:
          - { label: "Layout", name: layout, widget: select, options: [single, double, triple, carousel] }
          - label: "Fotos/vídeos desta linha"
            name: items
            widget: list
            collapsed: false
            summary: "{{type}}"
            types: *mediaRowItemTypes
      - label: "Conteúdo em Inglês"
        name: en
        widget: object
        hint: "Pode deixar em branco ao criar o case — depois rode `npm run translate-case <slug>` (veja o README) pra gerar o inglês automaticamente a partir do português."
        fields:
          - { label: "Título SEO", name: metaTitle, widget: string, required: false }
          - { label: "Descrição SEO", name: metaDescription, widget: text, required: false }
          - { label: "Título — linha 1", name: heroTitleLine1, widget: string, required: false }
          - { label: "Título — linha 2", name: heroTitleLine2, widget: string, required: false }
          - { label: "Texto alternativo da imagem principal", name: heroAlt, widget: string, required: false }
          - { label: "Tags (chips abaixo do título)", name: tags, widget: list, required: false, hint: "Separe por VÍRGULA, tudo numa linha só — ex: Identidade Visual, Estratégia de Marca, Motion, 2026. Uma por linha não funciona." }
          - { label: "Rótulo \"O desafio\"", name: challengeTag, widget: string, required: false }
          - { label: "Título do desafio", name: challengeHeading, widget: text, required: false }
          - { label: "Detalhe do desafio", name: challengeDetail, widget: text, required: false }
          - { label: "Rótulo \"A abordagem\"", name: approachTag, widget: string, required: false }
          - { label: "Título da abordagem", name: approachHeading, widget: text, required: false }
          - { label: "Detalhe da abordagem", name: approachDetail, widget: text, required: false }
          - { label: "Título do card (grade de cases)", name: cardTitle, widget: string, required: false }
          - { label: "Descrição do card (grade de cases)", name: cardDesc, widget: text, required: false }
      - label: "Conteúdo em Português"
        name: pt
        widget: object
        fields:
          - { label: "Título SEO", name: metaTitle, widget: string }
          - { label: "Descrição SEO", name: metaDescription, widget: text }
          - { label: "Título — linha 1", name: heroTitleLine1, widget: string }
          - { label: "Título — linha 2", name: heroTitleLine2, widget: string }
          - { label: "Texto alternativo da imagem principal", name: heroAlt, widget: string }
          - { label: "Tags (chips abaixo do título)", name: tags, widget: list, hint: "Separe por VÍRGULA, tudo numa linha só — ex: Identidade Visual, Estratégia de Marca, Motion, 2026. Uma por linha não funciona." }
          - { label: "Rótulo \"O desafio\"", name: challengeTag, widget: string }
          - { label: "Título do desafio", name: challengeHeading, widget: text }
          - { label: "Detalhe do desafio", name: challengeDetail, widget: text }
          - { label: "Rótulo \"A abordagem\"", name: approachTag, widget: string }
          - { label: "Título da abordagem", name: approachHeading, widget: text }
          - { label: "Detalhe da abordagem", name: approachDetail, widget: text }
          - { label: "Título do card (grade de cases)", name: cardTitle, widget: string }
          - { label: "Descrição do card (grade de cases)", name: cardDesc, widget: text }
