              - { label: "Cases", name: cases, widget: string }
              - { label: "FAQ", name: faq, widget: string }
              - { label: "Botão de contato", name: cta, widget: string }
              - { label: "Showreel", name: reel, widget: string }
          - label: "Banner (hero)"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Título, linha 1", name: l1, widget: string }
              - { label: "Título, linha 2", name: l2, widget: string }
              - { label: "Botão de cases", name: cases, widget: string }
          - label: "Dados no banner"
            name: meta
            widget: list
            collapsed: true
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Rótulo", name: label, widget: string }
              - { label: "Valor", name: value, widget: string }
          - label: "Showreel"
            name: reelSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Botão", name: cta, widget: string }
              - { label: "Legenda do vídeo", name: label, widget: string }
              - { label: "Texto 'Assistir'", name: watch, widget: string }
          - label: "Serviços: cabeçalho"
            name: servicesSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: lead, widget: text }
              - { label: "Texto 'Case relacionado'", name: related, widget: string }
              - { label: "Botão", name: talk, widget: string }
          - label: "Serviços (abas)"
            name: services
            widget: list
            collapsed: true
            summary: "{{fields.t}}"
            fields:
              - { label: "Código interno (não altere)", name: key, widget: string, hint: "Liga o serviço à imagem e ao filtro. Ex: estrategia" }
              - { label: "Nome da aba", name: tab, widget: string }
              - { label: "Título", name: t, widget: string }
              - { label: "Subtítulo", name: s, widget: string }
              - { label: "Descrição", name: d, widget: text }
              - { label: "Entregas", name: l, widget: list, field: { label: "Entrega", name: item, widget: string } }
          - label: "Cases na home: cabeçalho"
            name: casesSec
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Botão 'Todos os cases'", name: all, widget: string }
          - label: "Seção de números e avaliações"
